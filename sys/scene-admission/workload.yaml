schema: rey.workload-package.v1

workload:
  id: scene-admission
  revision: 1
  title: Admit exact editor scenes for regional projection
  inputs:
    - port_id: text
      value_type: utf8
  outputs:
    - port_id: text
      value_type: utf8

generation:
  kind: coding_harness
  producer: codex
  producer_revision: gpt-5
  generated:
    - compute_graph
    - scenario_suite
  inputs:
    - source: plans/0003-scene-to-explorer.md
      revision: sha256:8141c5b515660a3fc8a1a5ffdedbb9910eea5c458d130029a479fe8666ae5ca8
    - source: docs/EXPLORER.md
      revision: sha256:8d19fbf6250c6a71b579812c36ca456891651c34daa52daeac72fa5eabecabea

graph:
  id: scene-admission.graph
  revision: 1
  nodes:
    - id: admit
      operation:
        id: rey.scene-admission.validate
        revision: 1
      input:
        kind: external_input
        input_id: text
      value_type: scene_admission
    - id: render
      operation:
        id: rey.admitted-regional-scene.render-lines
        revision: 1
      input:
        kind: node_output
        node_id: admit
        output_id: value
      value_type: utf8
  outputs:
    - id: text
      source:
        kind: node_output
        node_id: render
        output_id: value
      value_type: utf8

scenarios:
  id: scene-admission.scenarios
  revision: 1
  cases:
    - id: accepted
      revision: 1
      required: true
      inputs:
        text: SCENE@2
      expected:
        text: |-
          SCENE ADMISSION
          OUTCOME ACCEPTED · accepted
          DETAIL exact current editor package and every bounded native object passed the declared admission contract
          SCENE fixture-county · SCENE@2 · 1 native objects · 1 layers · 3 validity records
          NATIVE OGC:CRS84 longitude/latitude · -123000000µ°, 37000000µ° → -122000000µ°, 38000000µ° · exact geographic source evidence
          SYNTHETIC semantic longitude/latitude · revision-bound projection placement · no Earth CRS or distance claim
          MERCATOR spherical chart of synthetic semantic coordinates · 360000000µ° wrap · ±85051129µ° cutoff with polar disclosure · analytic inverse · not EPSG:3857
          COUNTY local east/north/up · revision-bound tangent frame · bounded inverse inside admitted native envelope · envelope is not footprint geometry
          FOOTPRINT admitted · source fixture-county/county-boundary · Polygon · 1 rings / 4 coordinates · exact identity and validity boundary retained
          CAMERA view only · center/scale/viewport/selection are not evidence identity
          ARTIFACTS topography=none · atlas=none · projection=retained · terrain=none
          COVERAGE complete · 1 omissions · native objects complete; terrain height explicitly unsupported
          AUTHORITY qualified workload result only; no editor mutation, browser admission, terrain inference, action, or proof authority
      scene:
        fixture: accepted

