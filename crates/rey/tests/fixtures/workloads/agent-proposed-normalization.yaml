schema: rey.workload-package.v1

workload:
  id: rey.fixture.agent-proposed-normalization
  revision: 1
  title: Normalize a proposed label
  inputs:
    - port_id: text
      value_type: utf8
  outputs:
    - port_id: text
      value_type: utf8

generation:
  kind: coding_harness
  producer: codex
  producer_revision: fixture-v1
  generated:
    - compute_graph
    - scenario_suite
  inputs:
    - source: AGENTS.md
      revision: fixture:agents-v1

graph:
  id: rey.fixture.agent-proposed-normalization.graph
  revision: 1
  nodes:
    - id: trim
      operation:
        id: rey.builtin.utf8.trim
        revision: 1
      input:
        kind: external_input
        input_id: text
      value_type: utf8
    - id: uppercase
      operation:
        id: rey.builtin.utf8.uppercase
        revision: 1
      input:
        kind: node_output
        node_id: trim
        output_id: value
      value_type: utf8
  outputs:
    - id: text
      source:
        kind: node_output
        node_id: uppercase
        output_id: value
      value_type: utf8

scenarios:
  id: rey.fixture.agent-proposed-normalization.scenarios
  revision: 1
  cases:
    - id: plain
      revision: 1
      required: true
      inputs:
        text: retest
      expected:
        text: RETEST
    - id: surrounded
      revision: 1
      required: true
      inputs:
        text: " refine "
      expected:
        text: REFINE
