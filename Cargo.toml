[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22.1"
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }
polars = { version = "0.55.2", default-features = false, features = ["fmt", "ipc_streaming"] }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
