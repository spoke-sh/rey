[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Rey contributors"]
description = "Diff-directed mining and compute runtime for agents"
edition = "2024"
homepage = "https://github.com/spoke-sh/rey"
license = "MIT"
readme = "README.md"
repository = "https://github.com/spoke-sh/rey"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8.9"
base64 = "0.22.1"
blake3 = "1.8.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.9"
polars = { version = "0.55.2", default-features = false, features = ["fmt", "ipc_streaming"] }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = { version = "1.0.1", default-features = false, features = ["deserialize"] }
signal-hook = "0.4.4"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.49.0", features = ["net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# The operator server validates and hashes high-resolution retained terrain in
# development. Keep the relevant pure-compute crates optimized so `just rey
# agent` exercises production-shaped data without turning every cold read into
# a debug-interpreter benchmark.
[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.rey-mining]
opt-level = 2

[profile.dev.package.rey-runtime]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
