schema: rey.env-map.v2
nodes:
  - id: path
    kind: variable
    name: PATH
    sensitive: false
    capture: value
  - id: cargo-home
    kind: variable
    name: CARGO_HOME
    sensitive: false
    capture: value
  - id: spoke-endpoint
    kind: variable
    name: SPOKE_ENDPOINT
    sensitive: false
    capture: value
  - id: spoke-token
    kind: variable
    name: SPOKE_TOKEN
    sensitive: true
    capture: presence
  - id: workspace-manifest
    kind: file
    path: Cargo.toml
    required: true
  - id: development-shell
    kind: file
    path: flake.nix
    required: true
  - id: task-surface
    kind: file
    path: justfile
    required: true
  - id: cargo
    kind: executable
    name: cargo
    required: true
    potential_capabilities:
      - rust.build
      - rust.check
      - rust.test
  - id: git
    kind: executable
    name: git
    required: true
    potential_capabilities:
      - git.repository.inspect
  - id: rg
    kind: executable
    name: rg
    required: false
    potential_capabilities:
      - source.search.literal
edges:
  - from: path
    to: cargo
    relation: resolves
  - from: path
    to: git
    relation: resolves
  - from: path
    to: rg
    relation: resolves
  - from: cargo-home
    to: cargo
    relation: configures
  - from: workspace-manifest
    to: cargo
    relation: input_to
  - from: development-shell
    to: cargo
    relation: constrains
  - from: task-surface
    to: cargo
    relation: orchestrates
