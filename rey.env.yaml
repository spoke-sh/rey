schema: rey.env-map.v3
nodes:
  - id: path
    kind: variable
    name: PATH
    sensitive: false
    capture: value
  - id: spoke-endpoint
    kind: variable
    name: SPOKE_ENDPOINT
    sensitive: false
    capture: value
  - id: spoke-token
    kind: variable
    name: SPOKE_TOKEN
    sensitive: true
    capture: presence
  - id: workspace-manifest
    kind: file
    path: Cargo.toml
    required: true
  - id: development-shell
    kind: file
    path: flake.nix
    required: true
  - id: task-surface
    kind: file
    path: justfile
    required: true
  - id: git
    kind: executable
    name: git
    purpose: Inspect repository identity and activation inputs
    required: true
    potential_capabilities:
      - git.repository.inspect
  - id: rg
    kind: executable
    name: rg
    purpose: Extend bounded source mining with fast text search
    required: false
    potential_capabilities:
      - source.search.literal
edges:
  - from: path
    to: git
    relation: resolves
  - from: path
    to: rg
    relation: resolves
